<html lang="en">
<head>
<meta charset="UTF-8">
<title>DDHS Login | PHC-AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* SAME STYLE */
:root{
    --primary:#16a34a;
    --secondary:#0ea5a4;
    --accent:#22c55e;
    --light:#f0fdf4;
    --card:#ffffff;
    --text:#052e16;
    --muted:#4b5563;
    --shadow:0 18px 45px rgba(0,0,0,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(135deg,#ecfdf5,#f0fdfa,#ffffff);color:var(--text);}

/* NAVBAR */
nav{
    background:linear-gradient(90deg,#16a34a,#0ea5a4);
    padding:16px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
}

nav h2{
    color:#fff;
    font-weight:800;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    gap:10px;
}

nav h2 i{
    background:rgba(255,255,255,0.2);
    padding:10px;
    border-radius:14px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:28px;
}

nav ul li a{
    text-decoration:none;
    color:#eafff1;
    font-weight:600;
    transition:.3s;
}
nav ul li a:hover{
    color:#fff;
    text-shadow:0 0 10px rgba(255,255,255,0.7);
}

nav .btn{
    background:#fff;
    color:var(--primary);
    padding:10px 22px;
    border-radius:30px;
    text-decoration:none;
    font-weight:700;
    transition:.3s;
}
nav .btn:hover{
    transform:translateY(-2px);
    background:var(--light);
}
.page{padding:60px 8%;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;}

.section-title span{
    display:inline-block;background:linear-gradient(90deg,#dcfce7,#ccfbf1);
    padding:10px 22px;border-radius:30px;font-weight:800;color:#065f46;
    box-shadow:0 10px 25px rgba(0,0,0,0.06);
}
.section-title h2{margin-top:18px;font-size:36px;font-weight:900;position:relative;display:inline-block;}
.section-title h2:after{
    content:"";position:absolute;left:0;bottom:-12px;width:70%;height:5px;border-radius:10px;
    background:linear-gradient(90deg,var(--primary),var(--secondary));
}
.desc{margin-top:18px;color:var(--muted);line-height:1.7;}

.login-card{
    background:rgba(255,255,255,0.92);
    border-radius:26px;padding:35px;box-shadow:var(--shadow);
    border:1px solid rgba(22,163,74,0.15);
}
.login-card h3{color:var(--primary);font-weight:900;margin-bottom:20px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-weight:700;margin-bottom:6px;}
.form-group input{
    width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(0,0,0,0.12);
    outline:none;transition:.3s;
}
.form-group input:focus{border-color:rgba(22,163,74,0.6);box-shadow:0 0 0 4px rgba(34,197,94,0.18);}
.login-btn{
    width:100%;padding:12px;border:none;border-radius:30px;
    background:linear-gradient(90deg,var(--primary),var(--secondary));
    color:#fff;font-weight:900;cursor:pointer;transition:.3s;margin-top:10px;
}
.login-btn:hover{transform:translateY(-2px);}

.hero-image{
    position:relative;border-radius:26px;overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.18);
    border:1px solid rgba(22,163,74,0.18);
    min-height:420px;
}
.hero-image img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-image:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(22,163,74,0.35),rgba(14,165,164,0.25));}
.img-caption{
    position:absolute;bottom:18px;left:18px;z-index:5;color:#fff;
    padding:14px 18px;border-radius:18px;background:rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);font-weight:800;font-size:14px;
}

@media(max-width:900px){.page{grid-template-columns:1fr;}}
</style>
</head>

<body>

<nav>
    <h2><i class="fa fa-leaf"></i> PHC-AI</h2>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/login_doc">Doctor</a></li>
        <li><a href="/login_ddhs">DDHS</a></li>
        <li><a href="/login_hmo">HMO</a></li>
    </ul>
    <a href="/login" class="btn">PHC Admin</a>
</nav>

<section class="page">
    <div>
        <div class="section-title">
            <span><i class="fa fa-building"></i> District Portal</span>
            <h2>DDHS Login</h2>
        </div>

        <p class="desc">
            DDHS portal to monitor PHC doctor attendance, violations, and reports.
        </p>

        <div class="login-card">
            <h3><i class="fa fa-right-to-bracket"></i> Sign In</h3>

            <form method="post" action="/login_ddhs">
                <div class="form-group">
                    <label>DDHS Username</label>
                    <input type="text" name="uname" placeholder="Enter Username" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="pass" placeholder="Enter Password" required>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fa fa-lock"></i> Login
                </button>
            </form>
        </div>
    </div>

    <div class="hero-image">
        <img src="https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=1200&q=80" alt="DDHS Portal">
        <div class="img-caption"><i class="fa fa-chart-line"></i> District Monitoring Dashboard</div>
    </div>
</section>

</body>
</html>
